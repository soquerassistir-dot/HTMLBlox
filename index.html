<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROBLOX BR - Multiplayer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>

<style>
body{margin:0;overflow:hidden;background:#87CEEB;font-family:Arial}
.ui{position:absolute;background:rgba(0,0,0,.7);color:#fff;padding:10px;border-radius:8px}
#adminPanel{display:none;top:50%;left:50%;transform:translate(-50%,-50%);width:260px;z-index:9999}
button,input{width:100%;margin-top:5px}
</style>
</head>

<body>

<div id="adminPanel" class="ui">
  <h3>🔐 Admin</h3>
  <input id="adminKey" placeholder="Admin key">
  <button onclick="authAdmin()">Entrar</button>

  <div id="adminControls" style="display:none">
    <input id="adminMsg" placeholder="Mensagem global">
    <button onclick="sendAdminMsg()">📢 Enviar</button>
    <button onclick="resetWorld()">♻ Resetar Mundo</button>
    <button onclick="resetPlayers()">♻ Resetar Players</button>
  </div>
</div>

<script>
const socket = io();
let isAdmin = false;

// ===== THREE =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(50,100,50);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff,.5));

// chão
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  new THREE.MeshPhongMaterial({color:0x808080})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

// player
let player = new THREE.Group();
scene.add(player);

function part(w,h,d,c,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshPhongMaterial({color:c}));
  m.position.set(x,y,z);player.add(m);
}

part(1.2,1.2,1.2,0xffff00,0,4.8,0);
part(2,2,1,0x0000ff,0,3.4,0);
part(1,2,1,0xffff00,-1.5,3.4,0);
part(1,2,1,0xffff00,1.5,3.4,0);
part(1,2,1,0x00ff00,-0.5,1.4,0);
part(1,2,1,0x00ff00,0.5,1.4,0);

camera.position.set(0,10,20);

// ===== ADMIN =====
document.addEventListener("keydown",e=>{
  if(e.code==="F10"){
    adminPanel.style.display=adminPanel.style.display==="none"?"block":"none";
  }
});

function authAdmin(){
  socket.emit("adminAuth",adminKey.value);
}

socket.on("adminAuthSuccess",()=>{
  isAdmin=true;
  adminKey.style.display="none";
  adminControls.style.display="block";
});

socket.on("adminAuthFail",()=>alert("Key errada"));

function sendAdminMsg(){
  socket.emit("adminMessage",adminMsg.value);
  adminMsg.value="";
}

function resetWorld(){ socket.emit("resetWorld"); }
function resetPlayers(){ socket.emit("resetPlayers"); }

// ===== SERVER EVENTS =====
socket.on("worldReset",()=>{
  alert("🌍 Mundo resetado");
});

socket.on("playersReset",()=>{
  player.position.set(0,0,0);
});

// ===== LOOP =====
function animate(){
  requestAnimationFrame(animate);
  camera.lookAt(player.position);
  renderer.render(scene,camera);
}
animate();

window.onresize=()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
};
</script>
</body>
</html>
